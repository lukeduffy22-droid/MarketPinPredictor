[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MarketPinPredictor"
version = "0.1.0"
description = "Market index prediction system with FastAPI, Streamlit, and gamma exposure analytics."
requires-python = ">=3.9"
dependencies = [
    "api-session==1.4.2",
    "apig-wsgi==2.19.0",
    "apimatic-core==0.2.16",
    "databento>=0.56.0",
    "fastapi>=0.121.1",
    "livekit-plugins-openai>=0.10.0",
    "numpy>=1.24.0,<2.0.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "polygon>=1.2.8",
    "polygon-api-client>=1.16.3",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "pytz>=2024.1",
    "replit-object-storage>=1.0.2",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.28.0",
    "tenacity>=9.1.2",
    "tensorflow>=2.13.0",
    "torch>=2.8.0",
    "uvicorn>=0.38.0",
    "websocket-client>=1.6.0",
    "xgboost>=2.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
