name: Backend Quality Gate

on:
  push:
    branches:
      - friday-1/9
      - publish/rest-fallback-fix
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_local.txt

      - name: Run targeted backend tests
        run: |
          python -m pytest tests/test_api_health.py tests/test_api_routes.py tests/test_backend_prediction_client.py tests/test_settings.py -q
