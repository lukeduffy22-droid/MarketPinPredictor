name: source-integration-quality-gate

on:
  pull_request:
    branches:
      - friday-1/9
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

jobs:
  opening-ingress-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install opening diagnostic test dependencies
        run: |
          python -m pip install 'pytest==9.0.2' 'databento==0.86.0' 'databento-dbn==0.69.0' \
            'numpy==1.26.4' 'pandas==2.3.3' 'pyarrow==21.0.0' \
            'scipy==1.16.3' 'sqlalchemy==2.0.44' python-dotenv

      - name: Verify startup, timing admission and retained evidence boundaries
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_databento_iterator_startup.py \
            tests/test_opening_queue_startup_diagnostics.py \
            tests/test_opening_timing_admission_diagnostics.py \
            tests/test_opening_ingress_report.py \
            tests/test_opening_readiness_timeline.py \
            tests/test_opening_timeline_identity.py

  publication-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch protected integration base
        run: git fetch origin friday-1/9

      - name: Reject secrets, runtime artifacts, and oversized new blobs
        run: python tools/check_publication_boundary.py --base origin/friday-1/9

  offline-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic sqlalchemy websockets numpy pandas requests python-dotenv databento httpx streamlit

      - name: Compile source entrypoints
        run: |
          python -m compileall -q app.py app backend tools

      - name: Run provenance and provider contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_gex.py \
            tests/test_gex_invariants.py \
            tests/test_streamer_provider_selection.py \
            tests/test_closing_tape_readiness.py \
            tests/test_prediction_authority.py \
            tests/test_validation_method_labels.py \
            tests/test_market_event_sources.py \
            tests/test_market_issuer_feeds.py \
            tests/test_market_event_estimates.py \
            tests/test_market_event_quotes.py \
            tests/test_market_event_proxies.py \
            tests/test_market_event_monitor.py \
            tests/test_market_events_view.py \
            tests/test_rut_closing_series.py \
            tests/test_monitor_scan_collector.py::test_collector_commit_reload_collector_uses_real_receipt \
            tests/test_databento_symbol_catalog.py \
            tests/test_inspect_opening_capture.py::test_mini_contracts_cannot_prove_rut_subscription_via_legacy_summary
